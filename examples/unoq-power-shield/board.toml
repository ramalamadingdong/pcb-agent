# not ours to choose. Everything else is hand-placed and locked; the
# placement loop only repairs and scores. Board frame, bottom-left, Y-up.
# Header strips: PinHeader pin1 at the given point, pins run toward -Y
# at rot 0 and +Y at rot 180.

