pins = [
  { number = "1", name = "S", type = "passive" },
  { number = "2", name = "S", type = "passive" },
  { number = "3", name = "S", type = "passive" },
  { number = "4", name = "G", type = "input" },
  { number = "5", name = "D", type = "passive" },
  { number = "6", name = "D", type = "passive" },
  { number = "7", name = "D", type = "passive" },
  { number = "8", name = "D", type = "passive" },
]

