  { number = "1", name = "A1", type = "input" },
  { number = "2", name = "A0", type = "input" },
  { number = "3", name = "ALERT", type = "open_collector" },
  { number = "4", name = "SDA", type = "bidirectional" },
  { number = "5", name = "SCL", type = "input" },
  { number = "6", name = "VS", type = "power_in" },
  { number = "7", name = "GND", type = "power_in" },
