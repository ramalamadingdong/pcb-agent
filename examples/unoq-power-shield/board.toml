# board.toml — UNO Q power & I/O demo shield (rev 1)
# Checker rules AND build-pass parameters. ONE coordinate frame everywhere:
# origin at the board's bottom-left corner, X right, Y UP — the frame of
# the UNO Q drill data these numbers were extracted from, of the exported
# gerbers (export_fab pins the aux origin to that corner), and of every
# rectangle scripts/validate_gerbers.py checks. Portrait: X across
# 53.34 mm, Y along 68.58 mm, antenna/USB-C edge at the top (Y = 68.58).

[board]
name = "unoq-power-shield"

[frame]
outline_bbox = [0.0, 0.0, 53.34, 68.58]
tolerance_mm = 0.5

# ---------------------------------------------------------------- checker

[layers]
# In1 = solid GND under the switcher, In2 = 5V power plane. Tracks on
# either is a FAIL; pours are what they are for.
planes = ["In1_Cu", "In2_Cu"]

[nets.power]
patterns = ["VIN", "VIN_RAW", "VIN_PROT", "5V", "GND"]
# 0.30, not the IPC-2221 2.0 mm the 4 A worst case implies: the power
# netclass must be able to ENTER the narrowest pad on its nets, and the
# INA226's sense pins are 0.3 mm (the rev-D lesson: a 0.5 mm class left
# 24 nets unrouted because freerouting refuses a track wider than the
# pad). Surface power tracks are short hops; the real current path is
# the In2 plane plus the F.Cu VIN pours below ([[zones.pour]]), whose
# cross-section satisfies the IPC math. The floor still catches the
# classic failure this rule exists for: power routed at a generated
# 0.2 mm default.
min_width_mm = 0.30
class_width_mm = 0.30

[silkscreen]
margin_mm = 0.0

[mounting_holes]
# Fixed by the UNO form factor — UNO Q drill file T08 block, not ours to
# choose. Board frame, bottom-left origin, Y up.
count = 4
diameter_mm = 3.2
tolerance_mm = 0.05
positions = [[50.80, 53.34], [35.56, 2.54], [7.62, 2.54], [2.54, 54.61]]

[fiducials]
# JLCPCB assembly. The pass stamps the X2 AperFunction fabrication
# attribute — rev D2 shipped bare copper dots the checker couldn't see.
count = 3
min_collinear_deviation_mm = 1.0
positions = [[31.0, 36.0], [8.0, 33.0], [46.0, 58.0]]

# The UNO Q's Wi-Fi PCB antenna sits directly under this region (measured
# from Arduino's own top.art: copper spans X 0.76-22.1, Y 63.9-68.07;
# margin added). Copper here — any layer, pads included — detunes the
# radio of the board underneath.
[[keepouts]]
name = "unoq_wifi_antenna"
x1 = 0.0
y1 = 61.0
x2 = 26.0
y2 = 68.58
layers = ["F_Cu", "In1_Cu", "In2_Cu", "B_Cu"]

# The buck's PowerPAD vias — the only path that keeps U1 within ~35 degC
# of ambient at full load. Region = U1's exposed pad at its floorplan
# position (U1 at (20,22), HSOIC-8 EP ~2.4x3.1 mm).
[[thermal_vias]]
name = "buck_powerpad"
x1 = 18.4
y1 = 20.0
x2 = 21.6
y2 = 24.0
min_count = 4

# ------------------------------------------------------------ build: libs

[build]
width_mm = 53.34
height_mm = 68.58
layers = 4
title = "unoq-power-shield"
revision = "1"

[project]
footprint_lib = "unoq_power_shield.pretty"

[libs]
name = "unoq_power_shield"
out_dir = "."
vendor_dir = "footprints.pretty"
extra_footprints = ["MountingHole_3.2mm"]

[[libs.symbols]]
name = "TPS54331"
reference = "U"
footprint = "TI_SO-PowerPAD-8"
description = "TI TPS54331 3A 28V buck, SO-8 PowerPAD (TPS54331DDAR.pdf sec.5)"
datasheet = "docs/datasheets/TPS54331DDAR.pdf"
pins = [
  { number = "1", name = "BOOT", type = "input" },
  { number = "2", name = "VIN", type = "power_in" },
  { number = "3", name = "EN", type = "input" },
  { number = "4", name = "SS", type = "input" },
  { number = "5", name = "VSENSE", type = "input" },
  { number = "6", name = "COMP", type = "output" },
  { number = "7", name = "GND", type = "power_in" },
  { number = "8", name = "PH", type = "output" },
  { number = "9", name = "PAD", type = "power_in" },
]

[[libs.symbols]]
