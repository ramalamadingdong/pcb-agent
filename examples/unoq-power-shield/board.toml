# ----------------------------------------------------------- build: route

[[zones.pour]]
net = "GND"
layer = "In1_Cu"
clearance_mm = 0.25
min_thickness_mm = 0.15
[[zones.pour]]
net = "5V"
layer = "In2_Cu"
clearance_mm = 0.25
min_thickness_mm = 0.15
[[zones.pour]]
net = "VIN"
layer = "F_Cu"
clearance_mm = 0.25
min_thickness_mm = 0.15
priority = 2
bbox = [2.0, 12.0, 26.0, 30.0]
[[zones.pour]]
net = "GND"
layer = "F_Cu"
clearance_mm = 0.25
min_thickness_mm = 0.15
priority = 1
[[zones.pour]]
net = "GND"
layer = "B_Cu"
clearance_mm = 0.25
min_thickness_mm = 0.15
priority = 1

[[fanout.thermal_vias]]
ref = "U1"
pad = "9"
net = "GND"
via_size_mm = 0.6
via_drill_mm = 0.3

[route]
via_size_mm = 0.6
via_drill_mm = 0.3
track_width_mm = 0.25
power_track_width_mm = 0.30
clearance_mm = 0.15

[[silk.text]]
