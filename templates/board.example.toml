[[keepouts]]
name = "antenna"
x1 = 50.0
y1 = 30.0
x2 = 60.0
y2 = 40.0
layers = ["F_Cu", "In1_Cu", "In2_Cu"]

[[thermal_vias]]
name = "module_pad"
x1 = 24.0
y1 = 24.0
x2 = 30.0
y2 = 30.0
min_count = 9
