# board.toml — what this board is supposed to be.
# Every rule you add here is one you never have to remember again.
# Anything you catch by hand, add as a rule. That is the whole point.

[board]
name = "my-board"

[layers]
# Inner layers you declared solid planes. Any track on these is a FAIL:
# a signal here breaks the reference plane for everything above it.
planes = ["In1_Cu", "In2_Cu"]

[nets.power]
# The generated netclass patterns (VCC*, VDD*, +*V) match none of the usual
# names, so power traces come out at default width and nothing errors.
patterns = ["VBUS", "VSYS", "VBAT", "+3V3", "+5V", "GND", "VDD*", "VCC*"]
min_width_mm = 0.30

[silkscreen]
# Fab clips anything past the outline, so it just prints bare.
margin_mm = 0.0

[mounting_holes]
# Not netlist objects — nothing emits them and nothing checks them.
count = 4
diameter_mm = 3.2
tolerance_mm = 0.05

[fiducials]
count = 3
min_collinear_deviation_mm = 1.0

# Keepouts ban pours, tracks and vias — but not pads. Declare them here and
# this checks all layers, pads included.
# [[keepouts]]
# name = "antenna"
# x1 = 100.0
# y1 = 80.0
# x2 = 112.0
# y2 = 88.0
# layers = ["F_Cu", "In1_Cu", "In2_Cu", "B_Cu"]

# [[thermal_vias]]
# name = "module_exposed_pad"
# x1 = 120.0
# y1 = 90.0
# x2 = 130.0
# y2 = 98.0
# min_count = 9

# [[rf_budget]]
# net = "ANT"
# max_length_mm = 25.0

[[keepouts]]
name = "antenna"
x1 = 50.0
y1 = 30.0
x2 = 60.0
y2 = 40.0
layers = ["F_Cu", "In1_Cu", "In2_Cu"]

[[thermal_vias]]
name = "module_pad"
x1 = 24.0
y1 = 24.0
x2 = 30.0
y2 = 30.0
min_count = 9

# --------------------------------------------------------------------------
# Every connector a person plugs into. Checked by
# scripts/build/check_placement.py (`make check-placement`).
#
# EDGE connectors (the default): the gap from the mating face to the outline,
# the corridor a plug and its cable need, and WHICH WAY THE PART ACTUALLY
# FACES. That is derived from its rotation, by fitting its pads to the
# library footprint, and compared with the opening you read off the
# datasheet (below). A part rotated 180 deg at the edge otherwise passes
# every clearance test while its opening points into the board.
#
# VERTICAL connectors (pin headers, top-entry sockets, a shield's stacking
# headers): an access ring on the mating side must be clear of other parts.
#
# Any ref starting J/P/CN/USB that is in neither list below FAILS: an
# undeclared connector is one nothing ever checked.
#
# Opening direction per FOOTPRINT, library-local (+x/-x/+y/-y), from the
# datasheet land drawing; write down the page:
# [connector_footprints."USB_C_Receptacle_XYZ"]
# opening = "-y"
# source  = "XYZ.pdf p.4: mating face is the edge opposite the SMT legs"
#
# [connector_policy]
# prefixes       = ["J", "P", "CN", "USB"]   # default
# not_user_mated = [{ ref = "J9", reason = "SWD pads, pogo-pin fixture only" }]
#
# [[connectors]]
# ref             = "J5"
# mating          = "vertical"
# mating_side     = "bottom"     # where the plug comes from: "top" for a
#                                # cable header, "bottom" for a shield's pins
# access_margin_mm = 1.0         # housing + finger room around the courtyard
#
# Mounting holes in a corridor are inflated to [mounting_holes]
# head_diameter_mm first: the obstruction is the SCREW HEAD, ~5.5-6 mm on an
# M3 pan head, and no courtyard in the file describes it.
#
# [[connectors]]
# ref               = "J1"
# face              = "bottom"  # board-frame edge: left/right/top/bottom, or
#                               # "auto" to take the nearest one
# mating_depth_mm   = 8.0       # clear space the plug/boot needs in front
# edge_offset_mm    = 0.5       # max gap from the mating face to the outline;
#                               # a negative gap (USB-C overhanging) is fine
# lateral_margin_mm = 0.5       # widen the corridor each side (shell, boot)
# keep_clear_mm     = 0.0       # extra on-board clearance behind the face
# accept_blockers   = ["H3"]    # refs in the corridor you have decided to
#                               # live with (a mounting hole at a fixed
#                               # position, say). Still measured, still
#                               # printed as "accepted:" — downgraded, never
#                               # hidden. Naming a ref that ISN'T in the
#                               # corridor is a FAIL: a stale acceptance is a
#                               # check that passes forever.

# [mounting_holes]
# head_diameter_mm = 6.0        # optional, default 6.0

# --------------------------------------------------------------------------
# The DRC and ERC ledgers. route.py and `make check` sample DRC 5x and FAIL
# on anything not explained here; `make check` runs ERC the same way. Every
# entry names the exact refs and carries its reason. An entry that matches
# nothing also fails: a stale acceptance is a check that passes forever.
#
# [drc]
# runs          = 5
# gate_warnings = false          # warnings are always reported
#
# [[drc.accept]]
# kind   = "courtyards_overlap"  # the DRC `type` from the JSON report
# refs   = ["H1", "J13"]         # exact set of refs the violation names
# count  = 1                     # how many per run this entry may absorb
# reason = "UNO form factor: both positions fixed by the host board"
#
# [[erc.accept]]
# kind   = "pin_not_driven"
# refs   = ["U3"]
# reason = "..."

# A keepout bans pads too, as far as this checker is concerned — KiCad DRC
# does not, so nothing else would ever catch one. Opt out per keepout:
# [[keepouts]]
# allow_pads = true
